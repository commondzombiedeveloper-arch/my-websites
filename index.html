<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Harga Live dari Google Sheets</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        table { border-collapse: collapse; width: 100%; max-width: 600px; margin-top: 20px;}
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2>Daftar Harga Update Otomatis</h2>
    <table id="tabel-harga">
        <thead>
            <tr>
                <th>Produk</th>
                <th>Harga</th>
            </tr>
        </thead>
        <tbody id="isi-tabel">
            <tr><td colspan="2">Sedang mengambil data... (Tunggu sebentar)</td></tr>
        </tbody>
    </table>

    <script>
        // GANTI LINK DI BAWAH INI DENGAN LINK CSV GOOGLE SHEETS ANDA
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRNIhuEN5Pa5AqS_ah7dRk38VWzvxFLBYGwd3yIg2dchojhM1ihGyB5u0UkxyRgDBfoDFimPUmnt3df/pub?output=csv";

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            complete: function(results) {
                // Baris ini untuk mengecek apakah data berhasil diambil (lihat di Inspect Element > Console)
                console.log("Data berhasil diambil:", results.data);

                let data = results.data;
                let htmlIsi = "";

                data.forEach(row => {
                    // Cek nama kolom. Sesuaikan "Produk" dan "Harga" dengan nama kolom di Excel Anda!
                    if(row.Produk && row.Harga) {
                        htmlIsi += `<tr>
                                        <td>${row.Produk}</td>
                                        <td>${row.Harga}</td>
                                    </tr>`;
                    }
                });

                // Jika berhasil tapi kosong (mungkin karena nama kolom beda)
                if(htmlIsi === "") {
                    document.getElementById("isi-tabel").innerHTML = "<tr><td colspan='2' style='color:red;'>Data terhubung, tapi nama kolom (Header) tidak cocok dengan script.</td></tr>";
                } else {
                    document.getElementById("isi-tabel").innerHTML = htmlIsi;
                }
            },
            error: function(err) {
                console.error("Gagal mengambil data:", err);
                document.getElementById("isi-tabel").innerHTML = "<tr><td colspan='2' style='color:red;'>Gagal mengambil data. Pastikan link CSV benar.</td></tr>";
            }
        });
    </script>

</body>
</html>
